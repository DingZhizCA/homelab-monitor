server:
  url: "http://127.0.0.1:8080"
  token: ""

agent:
  # Every Agent must use a unique ID. Agents sharing an ID overwrite each other.
  device_id: "homelab-node"
  display_name: "Home Lab Node"
  interval: 5s

monitoring:
  idle_interval: 60s
  active_interval: 5s

metrics_batch:
  # Keep disabled until the Server has an HTTPS, device-authenticated atomic batch writer.
  enabled: false
  # Enabling requires a private local state directory and every bound below.
  # state_directory: "/var/lib/homelab-monitor-agent/metrics-queue"
  # max_queued_snapshots: <positive count>
  # max_queued_bytes: <positive byte limit>
  # max_batch_snapshots: <positive count not greater than queue capacity>
  # max_body_bytes: <positive request byte limit>

collectors:
  cpu: true
  memory: true
  disk: true
  network: true
  # Enable only after confirming that the HDD uses a safe ATA/SATA path.
  power_state: false
  # Hardware-facing reads are deliberately slower to reduce wakeups.
  sensor_interval: 1m
  disk_interval: 5m
  power_state_interval: 1m

plugins:
  # Opt in only after the Server exposes the device-scoped plugin control routes.
  enabled: false
  # Set every field below before enabling; these values have no implicit defaults.
  # publisher_key_path: "/etc/homelab-monitor/plugin-publisher.pub"
  # permission_file: "/etc/homelab-monitor/plugin-grants.json"
  # staging_directory: "/var/lib/homelab-monitor/plugins/staging"
  # runtime_directory: "/run/homelab-monitor/plugins"
  # state_directory: "/var/lib/homelab-monitor-agent/plugins/state"
  # launcher_path: "/usr/libexec/homelab-monitor/plugin-launcher"
  # host_protocol_major: 1
  # The launcher applies these hard Linux limits before executing each plugin.
  # max_open_files: <positive descriptor count>
  # max_processes: <positive per-user process count>
  # max_file_bytes: <positive created-file byte limit>
  # max_address_space_bytes: <positive virtual-address byte limit>
  # max_cpu_seconds: <positive cumulative CPU seconds>
  # max_artifact_bytes: <explicit byte limit>
  # max_staging_bytes: <explicit total byte limit>
  # max_staged_packages: <positive package count>
  # max_staging_scan_entries: <positive filesystem scan bound>
  # staging_cleanup_interval: "1h"
  # staging_orphan_grace: "24h"
  # staging_cleanup_delete_limit: <positive package count>
  # staging_cleanup_timeout: "30s"
  # max_state_entries: <positive plugin count>
  # max_state_bytes: <explicit byte limit>
  # poll_interval: "5m"
  # operation_timeout: "30s"
  # Explicitly choose plugin restart failure policy before enabling control.
  # max_consecutive_failures: <positive count>
  # initial_failure_backoff: "<positive duration>"
  # max_failure_backoff: "<duration not shorter than initial backoff>"
